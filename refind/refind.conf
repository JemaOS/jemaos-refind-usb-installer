# rEFInd Configuration for JemaOS USB
# Auto-generated by add_refind_to_usb.sh

# Boot timeout (seconds)
timeout $REFIND_TIMEOUT

# Force menu to always show and wait for timeout
# screensaver 0
timeout_ext $REFIND_TIMEOUT

# Add this line to always show the menu:
default_selection 2

# scan_delay 1


# Theme configuration
$THEME_CONFIG


# Scan for operating systems and tools
# add manual to scan for custom entries
# scanfor internal,external,optical,manual
scanfor internal,external,optical


# Enable tools - using simple format for maximum compatibility
showtools reboot, shutdown, hidden_tags

# Use graphics mode (not text-only)
textonly false

# Don't use NVRAM (safer for USB)
use_nvram false

# Hide UI elements for cleaner look
# hideui singleuser,safemode,hwtest

# Enable logging for debugging (dynamic based on DEBUG_MODE)
log_level $REFIND_LOG_LEVEL

# Hide ROOT-A partition from being scanned
dont_scan_volumes "BootOrder,reserved,ROOT-A,ROOT-B,ROOT-C,EFI/tools"

# Primary JemaOS menu entry - uses dynamic volume name
# This entry will be auto-detected by rEFInd

menuentry "JEMAOS (Live)" {
    volume "$JEMAOS_PARTITION_LABEL"
    loader \EFI\BOOT\bootx64.efi
    icons/os_jemaos.png
    submenuentry "JEMAOS (Safe Mode)" {
        loader \EFI\BOOT\bootx64.efi
        options "cros_debug"
    }
    disabled
}

# Default selection - JemaOS should be first
default_selection "$JEMAOS_PARTITION_LABEL"

